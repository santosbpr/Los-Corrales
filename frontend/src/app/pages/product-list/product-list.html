<div class="product-list-container">
  
  <div class="header-section">
    <h1 class="page-title">Inventário Los Corrales</h1>
    <div class="actions-header">
      <div class="search-box">
        <span>🔍</span> <input type="text" placeholder="Pesquisar por nome ou referência..." [(ngModel)]="searchTerm">
      </div>
      <button class="btn-new-product" (click)="openNewProductModal()">
        + Novo Item
      </button>
    </div>
  </div>

  <div class="table-wrapper">
    <table class="premium-table">
      <thead>
        <tr>
          <th>Ref. (SKU)</th>
          <th>Nome do Produto</th>
          <th class="text-center">Preço</th>
          <th class="text-center">Qtd. Estoque</th> 
          <th class="text-right">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of filteredProducts">
          
          <td class="product-ref">
            <strong>{{ product.sku || product.reference || 'S/ REF' }}</strong>
          </td>
          
          <td class="product-name">
            <strong>{{ product.name }}</strong>
            <span class="product-category">{{ product.category }}</span>
          </td>
          
          <td class="text-center product-price">{{ product.price | currency:'EUR' }}</td>
          
          <td class="text-center qty-column">
            <strong>{{ product.quantity || product.stock || product.quantidade || '0' }}</strong>
            <span class="qty-unit">unids.</span>
          </td>

          <td class="text-right action-col">
            <button class="btn-action btn-edit" (click)="editProduct(product)">
              Editar
            </button>
            <button class="btn-action btn-delete" (click)="deleteProduct(product.id, product.name)">
              Excluir
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal-overlay" *ngIf="isModalOpen">
    <div class="modal-white-box">
      <app-product-form [product]="productToEdit" (productSaved)="closeModal()"></app-product-form>
      <button class="btn-close-modal" (click)="closeModal()">Cancelar / Fechar</button>
    </div>
  </div>

</div>
