<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="pf-form">

  <div class="form-group">
    <label class="form-label">Nome do Produto</label>
    <input class="form-input" type="text" formControlName="name" placeholder="Ex: Camisa Polo Pampa">
  </div>

  <div class="form-group">
    <label class="form-label">Categoria</label>
    <select class="form-select" formControlName="category">
      <option value="" disabled selected>Selecione uma categoria...</option>
      <option *ngFor="let cat of availableCategories" [value]="cat.name">{{ cat.name }}</option>
    </select>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Preço de Venda (R$)</label>
      <input class="form-input" type="number" formControlName="price" min="0" step="0.01" placeholder="0.00">
    </div>
    <div class="form-group">
      <label class="form-label">Custo (R$)</label>
      <input class="form-input" type="number" formControlName="cost" min="0" step="0.01" placeholder="0.00">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Cor Oficial</label>
      <select class="form-select" formControlName="color">
        <option value="" disabled selected>Selecione a cor...</option>
        <option *ngFor="let c of availableColors" [value]="c.name">{{ c.name }}</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Tamanho</label>
      <select class="form-select" formControlName="size">
        <option value="" disabled selected>Selecione o tamanho...</option>
        <option *ngFor="let s of filteredSizes" [value]="s.name">{{ s.name }}</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Estoque (Qtd)</label>
      <input class="form-input" type="number" formControlName="stock" min="0">
    </div>
  </div>

  <button type="submit" class="btn btn-primary btn-block" [disabled]="productForm.invalid || isSaving">
    {{ isSaving ? 'Salvando...' : 'Salvar Produto' }}
  </button>

</form>
