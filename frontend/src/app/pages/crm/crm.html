<div class="page">

  <h2 class="page-title">👥 Gestão de Clientes (CRM)</h2>
  <p class="page-subtitle">Cadastre e gerencie a base de consumidores da Los Corrales.</p>

  <hr class="divider">

  <div class="card">
    <h3 class="card-title">Novo Cliente</h3>

    <div class="form-row">
      <div class="form-group grow-2">
        <label class="form-label">Nome Completo *</label>
        <input class="form-input" type="text" [(ngModel)]="newCustomer.name" placeholder="Ex: João da Silva">
      </div>

      <div class="form-group">
        <label class="form-label">Telefone / WhatsApp</label>
        <input class="form-input" type="text" [(ngModel)]="newCustomer.phone" placeholder="(51) 99999-9999">
      </div>

      <div class="form-group">
        <label class="form-label">CPF *</label>
        <input class="form-input" type="text" [(ngModel)]="newCustomer.cpf" placeholder="000.000.000-00">
      </div>

      <div class="form-group grow-15">
        <label class="form-label">E-mail *</label>
        <input class="form-input" type="email" [(ngModel)]="newCustomer.email" placeholder="joao@email.com">
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" (click)="salvarCliente()" [disabled]="isSaving">
        {{ isSaving ? 'Salvando...' : 'Salvar Cliente' }}
      </button>
    </div>
  </div>

  <div class="card">
    <h3 class="card-title">Clientes Cadastrados</h3>

    <div class="table-wrapper">
      <table class="premium-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>CPF</th>
            <th>E-mail</th>
            <th class="text-right">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of customers">
            <td><strong>{{ c.name }}</strong></td>
            <td>{{ c.phone }}</td>
            <td>{{ c.cpf || '-' }}</td>
            <td>{{ c.email || '-' }}</td>
            <td class="text-right">
              <button class="btn-icon" (click)="excluirCliente(c.id, c.name)" title="Remover">🗑️</button>
            </td>
          </tr>
          <tr *ngIf="customers.length === 0">
            <td colspan="5" class="empty-row">Nenhum cliente cadastrado ainda.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
