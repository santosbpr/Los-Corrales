<div style="font-family: Arial, sans-serif; padding: 30px; background-color: #f8f9fa; min-height: 100vh;">
  
  <h2 style="margin-bottom: 5px; color: #1a1a1a;">🛒 Frente de Caixa / PDV</h2>
  <p style="color: #666; margin-bottom: 30px; font-size: 14px;">Registre a saída de mercadorias em tempo real</p>
  
  <hr style="border: 0; border-top: 1px solid #ddd; margin-bottom: 30px;">

  <div style="display: flex; gap: 30px; flex-wrap: wrap;">
    
    <div style="flex: 1; min-width: 320px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e0e0e0;">
      <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 18px; color: #333;">Nova Operação</h3>

      <div style="display: flex; flex-direction: column; gap: 20px;">
        
        <div>
          <label style="font-size: 13px; font-weight: bold; color: #4a4a4a; text-transform: uppercase;">Item de Vestuário</label>
          <select [(ngModel)]="selectedProduct" (change)="onProductChange()" 
                  style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 15px;">
            <option [ngValue]="null" disabled selected>Escolha um produto...</option>
            <option *ngFor="let p of products" [ngValue]="p">{{ p.name }} ({{ p.category }})</option>
          </select>
        </div>

        <div *ngIf="selectedProduct">
          <label style="font-size: 13px; font-weight: bold; color: #4a4a4a; text-transform: uppercase;">Variação / Tamanho</label>
          <select [(ngModel)]="selectedVariantIndex" 
                  style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 15px;">
            <option *ngFor="let v of selectedProduct.variants; let i = index" [value]="i">
              Cor: {{ v.color }} | Tam: {{ v.size }}
            </option>
          </select>
        </div>

        <div>
          <label style="font-size: 13px; font-weight: bold; color: #4a4a4a; text-transform: uppercase;">Quantidade Vendida</label>
          <input type="number" [(ngModel)]="quantity" min="1" 
                 style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 15px;">
        </div>

        <button (click)="finalizarVenda()" [disabled]="!selectedProduct"
                style="width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; margin-top: 10px;">
          Confirmar Saída de Caixa
        </button>

      </div>
    </div>

    <div style="flex: 1; min-width: 320px; display: flex; flex-direction: column; justify-content: flex-start;">
      <div *ngIf="selectedProduct" style="background: #1a1a1a; color: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h4 style="margin: 0; text-transform: uppercase; font-size: 12px; color: #aaa; letter-spacing: 1px;">Verificação de Disponibilidade</h4>
        <h2 style="margin: 10px 0 5px 0; font-size: 24px;">{{ selectedProduct.name }}</h2>
        <span style="background: #333; padding: 4px 10px; border-radius: 20px; font-size: 12px;">{{ selectedProduct.category }}</span>

        <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
          <p style="margin: 0; color: #aaa; font-size: 14px;">Estoque atual desta variação:</p>
          <h1 style="margin: 10px 0 0 0; font-size: 56px; color: #28a745;">
            {{ selectedProduct.variants[selectedVariantIndex]?.stock || 0 }} <span style="font-size: 18px; color: #fff;">unidades</span>
          </h1>
        </div>
      </div>
    </div>

  </div>
</div>
