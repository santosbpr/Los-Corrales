<div class="login-wrapper">
  
  <div class="login-left">
    <img src="/assets/images/login-banner.png" alt="Original Clothing Banner" class="banner-img">
  </div>

  <div class="login-right">
    <div class="form-container">
      
      <h1 class="title">Los Corrales</h1>
      <p class="subtitle">Acesso ao Sistema ERP</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <div class="input-group">
          <label>E-MAIL CORPORATIVO</label>
          <input type="email" formControlName="email" placeholder="nome@loscorrales.com"
                 [ngClass]="{'is-invalid': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}">
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>SENHA</label>
            <a href="#" class="forgot-password" (click)="esqueciSenha($event)">{{ enviandoReset ? 'Enviando...' : 'Esqueci a senha' }}</a>
          </div>
          <input type="password" formControlName="password" placeholder="••••••••"
                 [ngClass]="{'is-invalid': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}">
        </div>

        <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">Entrar na Plataforma</span>
          <span *ngIf="isLoading" class="loader">Processando...</span>
        </button>
        
      </form>

      <div class="footer-text">
        © Los Corrales Original Clothing 2022. <br>Todos os direitos reservados.
      </div>
      
    </div>
  </div>

</div>
